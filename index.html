<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="theme-color" content="#121212">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Música</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
<style>

:root{--bg:#121212;--side:#000;--card:#181818;--card2:#242424;--bd:#2f2f2f;--fg:#ffffff;--mu:#b3b3b3;--ac:#1ed760;--cd:#282828}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr);padding-top:env(safe-area-inset-top)}
aside{background:var(--side);padding:22px 12px;overflow:auto;min-height:0}
.logo{font-size:22px;font-weight:800;padding:4px 12px 22px;letter-spacing:-.5px}
.logo span{color:var(--ac)}
#tabs{display:flex;flex-direction:column;gap:4px}
#tabs button{background:transparent;color:var(--mu);font-weight:700;text-align:left;border-radius:8px;padding:10px 12px;font-size:15px}
#tabs button:hover{color:#fff}
#tabs button.on{background:var(--card2);color:#fff}
main{overflow:auto;min-height:0;background:linear-gradient(180deg,#2d2b57 0,#1a1a1a 340px,var(--bg) 460px);padding-bottom:calc(var(--fh,96px) + 28px)}
main section{display:none;padding:0 28px}
main section.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 28px 0;min-height:52px}
.hero{padding:30px 0 16px}
.hero h1{margin:4px 0 0;font-size:40px;letter-spacing:-1px;font-weight:800}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 14px}
.bar.center{justify-content:center}
button{font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:500px;padding:8px 16px;cursor:pointer;transition:background .15s,transform .05s}
button:hover{background:#333}
button:active{transform:scale(.97)}
button.pri{background:var(--ac);color:#000;font-weight:700}
button.pri:hover{background:#1fdf64}
button.on{color:var(--ac)}
button.ghost{background:transparent;border:1px solid #444}
button.big{width:100%;padding:22px;font-size:20px}
button.big2{padding:12px 36px;font-size:16px}
input:not([type]),input[type=text],input[type=number],textarea,select{background:var(--card2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
select{border-radius:500px;padding:8px 14px;min-width:200px;cursor:pointer}
textarea{width:100%;min-height:190px;font:13px ui-monospace,monospace}
.s{width:64px!important;text-align:center}
input[type=range]{accent-color:var(--ac)}
.mu{color:var(--mu)}
.w{color:#f0a04b;margin:6px 0}
#list{padding:4px 0}
.it{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;margin:0;cursor:pointer}
.it:hover{background:#2a2a2a}
.it.now b{color:var(--ac)}
.it .t{flex:1;min-width:0}
.it b,.it small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{color:var(--mu)}
.it button{background:transparent;padding:4px 8px;color:var(--mu)}
.it button:hover{color:#fff}
.lyr p{margin:0;padding:8px 0;font-size:18px;color:var(--mu)}
.lyr p.on{color:#fff;font-weight:800;font-size:22px}
#lm{padding:0 0 8px}
#chk p{margin:4px 0}
.clock{text-align:center;padding:30px 0 8px}
#pt{font-size:96px;font-weight:800;letter-spacing:-3px;line-height:1}
.cfg{display:flex;flex-wrap:wrap;gap:18px;color:var(--mu);justify-content:center;padding:18px 0}
.cfg label{display:flex;align-items:center;gap:8px}
#sx{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding-bottom:20px}
#sx>h3{grid-column:1/-1;margin:20px 0 4px;font-size:20px}
#sx .it{background:var(--card);margin:0}
#sx>.it:first-child{grid-column:auto}
footer{position:fixed;left:0;right:0;bottom:0;background:#181818;border-top:1px solid #2a2a2a;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:center;padding:10px 18px calc(10px + env(safe-area-inset-bottom));z-index:6}
.fl{min-width:0;display:flex;flex-direction:column;gap:2px}
.fl #pt2{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fc{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl{display:flex;justify-content:center;gap:10px;align-items:center}
.ctl button{background:transparent;padding:6px 10px}
.ctl button:hover{color:var(--ac)}
#pp{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center}
#sk{width:100%}
.ab{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.ab button{padding:5px 10px;font-size:13px}
.fr{display:flex;align-items:center;gap:8px}
#vo{width:100%}
#tm{white-space:nowrap}
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 aside{padding:8px 10px}
 .logo{display:none}
 #tabs{flex-direction:row;overflow-x:auto}
 #tabs button{white-space:nowrap;text-align:center}
 main section{padding:0 14px}
 .top{padding:12px 14px 0}
 .hero h1{font-size:28px}
 #pt{font-size:64px}
 footer{grid-template-columns:1fr;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
 .fr{display:none}
}
/* personaje */
#pj{position:fixed;left:0;bottom:var(--fh,90px);z-index:4;pointer-events:none;will-change:transform}
#pj.off{display:none}
#pjf{display:block;line-height:0}
#pjim{display:block;height:var(--ph,160px);width:auto;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transform-origin:50% 100%}
#pjim.sit{height:calc(var(--ph,160px)*.95)}
#pjim.lie{height:calc(var(--ph,160px)*.42)}
.gl{position:absolute;bottom:100%;margin-bottom:8px;left:0;width:max-content;max-width:190px;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:6px 9px;font-size:13px;line-height:1.3;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.gl::after{content:"";position:absolute;top:100%;left:18px;border:6px solid transparent;border-top-color:var(--cd)}
@keyframes pjSalta{0%{transform:translateY(0)}35%{transform:translateY(-60px)}70%,100%{transform:translateY(0)}}
.jump{animation:pjSalta .9s ease-out 2}
@keyframes pjSaluda{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.wave{animation:pjSaluda .6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pjTiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.shake{animation:pjTiembla .12s linear infinite}
@keyframes pjHunde{from{transform:translateY(0)}to{transform:translateY(6px)}}
.sink{animation:pjHunde 1s ease-out forwards}
@keyframes pjRespira{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
.breathe{animation:pjRespira 3s ease-in-out infinite;transform-origin:50% 100%}
</style></head><body>
<div class="app">
<aside>
 <div class="logo">🎧 Mi<span>Música</span></div>
 <nav id="tabs"><button data-t="m" class="on">🏠 Biblioteca</button><button data-t="l">🎤 Letra</button><button data-t="p">⏱ Pomodoro</button><button data-t="s">📊 Estadísticas</button></nav>
</aside>
<main>
 <div class="top"><p id="bn" class="w"></p><button id="pjt" class="ghost">🐾 ocultar</button></div>
 <section id="m" class="on">

  <div class="bar"><select id="sel"></select><button id="nl">＋ Lista</button><button class="pri" id="add">＋ Agregar canciones</button><input type="file" id="file" accept="audio/*" multiple hidden><button id="el" hidden>Editar lista</button><button id="dl" hidden>Borrar lista</button></div>

  <div id="ly" class="lyr"></div>
  <div id="edp" hidden>
   <textarea id="ed" placeholder="Pega la letra (una línea por verso) o edita el texto con tiempos [mm:ss.xx]"></textarea>
   <div class="bar"><button class="pri" id="sv">Guardar / sincronizar</button><button id="ck">Revisar</button></div>
   <div id="chk"></div>
  </div>
  <div id="tapp" hidden>
   <p class="mu">Pon la canción desde el inicio y toca el botón cada vez que empiece una línea (se compensan 0,3 s de reacción).</p>
   <p id="tp"></p>
   <button class="big pri" id="tb">Toque</button>
   <div class="bar"><button id="tu">Atrás</button><button id="tc">Cancelar</button></div>
  </div>
 </section>
 <section id="p">
  <div class="hero"><small class="mu">Modo enfoque</small><h1 id="pph">Enfoque</h1></div>
  <div class="clock"><div id="pt">25:00</div><div id="pn" class="mu"></div></div>
  <div class="bar center"><button class="pri big2" id="ps">Iniciar</button><button id="pk">Saltar</button><button id="pr">Reiniciar</button></div>
  <div class="cfg">
   <label>Enfoque (min) <input type="number" class="s" id="cf"></label>
   <label>Descanso <input type="number" class="s" id="cs"></label>
   <label>Largo <input type="number" class="s" id="cl"></label>
   <label>Volumen en descanso <input type="range" id="cd" min="0" max="100" style="width:140px"><span id="cdv"></span></label>
  </div>
 </section>
 <section id="s"><div class="hero"><small class="mu">Tu actividad</small><h1>Estadísticas</h1></div><div id="sx"></div></section>
</main>
</div>
<footer>
 <div class="fl"><b id="pt2">—</b><span class="mu" id="tm">0:00 / 0:00</span></div>
 <div class="fc">
  <div class="ctl"><button id="sh">🔀</button><button id="pv">⏮</button><button id="pp" class="pri">▶</button><button id="nx">⏭</button><button id="rp">🔁 No</button></div>
  <input type="range" id="sk" min="0" max="1000" value="0">
  <div class="ab"><button id="sa">A</button><input class="s" id="ia" placeholder="0:00"><input class="s" id="ib" placeholder="0:00"><button id="sb">B</button><button id="lp">Loop</button></div>
 </div>
 <div class="fr"><span class="mu">🔈</span><input type="range" id="vo" min="0" max="1" step="0.01" value="1"></div>
</footer>
<audio id="au"></audio>
<div id="pj" aria-hidden="true"><div class="gl" id="pjb" hidden></div><div id="pjf"><img id="pjim" alt="" src="saluda.png"></div></div>
<script>
const $=s=>document.querySelector(s),A=$('#au');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ft=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const pt=t=>{t=String(t).trim();const m=t.match(/^(\d+):(\d+(?:\.\d+)?)$/);if(m)return+m[1]*60+ +m[2];return t!==''&&!isNaN(+t)?+t:null};
const fh=s=>s<60?Math.round(s)+' s':s>=3600?(s/3600).toFixed(1)+' h':Math.round(s/60)+' min';
const day=()=>new Date().toLocaleDateString('en-CA');
const note=t=>{const b=$('#bn');if(b)b.textContent=t},mem=new Map();
window.onerror=m=>note('Error en la app: '+m);window.onunhandledrejection=e=>note('Error: '+(e.reason&&e.reason.message||e.reason));
let DB,songs=[],lists={},view='all',editing=false,cur=null,queue=[],rep=0,shuf=false,url=null,loop=false,drag=false,dirty=false,fd,ac;
let st={tot:0,focus:0,days:{},pomos:{}},cfg={f:25,s:5,l:15,d:30},pom={run:false,ph:'f',end:0,left:1500,n:0,vol:1};
/* almacenamiento (IndexedDB) */
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=DB.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=no}).catch(()=>null);
const put=s=>tx('songs','readwrite',o=>o.put(s)),kvset=(k,v)=>tx('kv','readwrite',o=>o.put(v,k)),kvget=k=>tx('kv','readonly',o=>o.get(k));
(async()=>{try{DB=await new Promise((ok,no)=>{const r=indexedDB.open('musica',1);r.onupgradeneeded=()=>{['songs'].forEach(n=>r.result.createObjectStore(n,{keyPath:'id'}));['blobs','kv'].forEach(n=>r.result.createObjectStore(n))};r.onsuccess=()=>ok(r.result);r.onerror=no});
 songs=await tx('songs','readonly',o=>o.getAll())||[];lists=await kvget('lists')||{};st=Object.assign(st,await kvget('st')||{});cfg=Object.assign(cfg,await kvget('cfg')||{});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){note('Este navegador no deja guardar canciones aquí: durarán solo mientras no cierres la pestaña. Súbela a GitHub Pages para que se guarden.')}
 pom.left=cfg.f*60;cfgUI();render();pomUI()})();
/* pestañas */
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('section,nav button').forEach(x=>x.classList.remove('on'));$('#'+t).classList.add('on');e.target.classList.add('on');if(t==='s')stats();if(t==='l'){li=-2;hl()}};
/* biblioteca y playlists */
const vids=()=>view==='all'?songs.map(s=>s.id):(lists[view]||[]);
function render(){
 $('#sel').innerHTML='<option value="all">Todas las canciones</option>'+Object.keys(lists).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');$('#sel').value=view;
 $('#el').hidden=$('#dl').hidden=view==='all';$('#el').textContent=editing?'Listo':'Editar lista';
 const ids=view==='all'||editing?songs.map(s=>s.id):lists[view]||[];
 $('#list').innerHTML=ids.map(id=>{const s=songs.find(x=>x.id===id);if(!s)return'';const inL=view!=='all'&&(lists[view]||[]).includes(id);
  return `<div class="it${cur&&cur.id===id?' now':''}" data-id="${id}"><div class="t" data-p><b>${esc(s.title)}</b><small>${esc(s.artist||'Sin artista')} · ${fh(s.secs)}</small></div>`+(editing?`<input type="checkbox" data-c ${inL?'checked':''}>`:view==='all'?'<button data-e>✎</button><button data-d>✕</button>':'<button data-r>✕</button>')+'</div>'}).join('')||'<p class="mu">Aún no hay canciones. Toca «Agregar canciones».</p>'}
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of e.target.files){const n=f.name.replace(/\.[^.]+$/,''),p=n.includes(' - ')?n.split(/ - (.+)/):['',n];const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),artist:p[0].trim(),title:(p[1]||n).trim(),a:null,b:null,lrc:'',secs:0,plays:0};mem.set(s.id,f);if(await put(s)==null||await tx('blobs','readwrite',o=>o.put(f,s.id))==null)note('No pude guardar «'+s.title+'»: sonará solo mientras no cierres la pestaña.');songs.push(s)}e.target.value='';render()};
$('#sel').onchange=e=>{view=e.target.value;editing=false;render()};
$('#nl').onclick=()=>{const n=(prompt('Nombre de la lista')||'').trim();if(!n||lists[n])return;lists[n]=[];view=n;editing=true;kvset('lists',lists);render()};
$('#el').onclick=()=>{editing=!editing;render()};
$('#dl').onclick=()=>{if(confirm('¿Borrar la lista «'+view+'»? Las canciones no se borran.')){delete lists[view];view='all';editing=false;kvset('lists',lists);render()}};
$('#list').onclick=e=>{const it=e.target.closest('.it');if(!it)return;const id=it.dataset.id,s=songs.find(x=>x.id===id),t=e.target;
 if(t.matches('[data-e]')){const ar=prompt('Artista',s.artist);if(ar===null)return;const ti=prompt('Título',s.title);if(ti===null)return;s.artist=ar.trim();s.title=ti.trim()||s.title;put(s);render();if(cur===s)head()}
 else if(t.matches('[data-d]')){if(t.dataset.s!=='1'){t.dataset.s='1';t.textContent='¿Seguro?';setTimeout(()=>{t.dataset.s='';t.textContent='✕'},3000)}else{songs=songs.filter(x=>x!==s);Object.keys(lists).forEach(k=>lists[k]=lists[k].filter(i=>i!==id));tx('songs','readwrite',o=>o.delete(id));tx('blobs','readwrite',o=>o.delete(id));kvset('lists',lists);if(cur===s){A.pause();A.removeAttribute('src');cur=null;head()}render()}}
 else if(t.matches('[data-r]')){lists[view]=lists[view].filter(i=>i!==id);kvset('lists',lists);render()}
 else if(t.matches('[data-c]')){const l=lists[view];lists[view]=t.checked?[...l,id]:l.filter(i=>i!==id);kvset('lists',lists)}
 else if(t.closest('[data-p]')&&!editing){queue=vids();play(id)}};
/* reproducción */
async function play(id){const s=songs.find(x=>x.id===id);if(!s)return;save();const b=mem.get(id)||await tx('blobs','readonly',o=>o.get(id));if(!b)return note('No encuentro el archivo de esta canción. Agrégala otra vez.');note('');
 if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);cur=s;A.src=url;A.play().catch(e=>note('No pude reproducir: '+e.message));s.plays++;put(s);loop=false;head();render();loadLy();if(!s.lrc)fetchLy()}
function step(d){if(!queue.length)queue=vids();if(!queue.length)return;let i=queue.indexOf(cur&&cur.id);i=shuf&&d>0?Math.floor(Math.random()*queue.length):(i+d+queue.length)%queue.length;play(queue[i])}
function head(){$('#pt2').textContent=cur?cur.title+(cur.artist?' — '+cur.artist:''):'—';$('#ia').value=cur&&cur.a!=null?ft(cur.a):'';$('#ib').value=cur&&cur.b!=null?ft(cur.b):'';$('#lp').classList.toggle('on',loop);$('#lt').textContent=cur?cur.title:'Sin canción';
 try{if(cur&&navigator.mediaSession)navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist})}catch(e){}}
try{const m=navigator.mediaSession;m.setActionHandler('play',()=>A.play());m.setActionHandler('pause',()=>A.pause());m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1))}catch(e){}
$('#pp').onclick=()=>{if(!cur){queue=vids();if(queue.length)play(queue[0]);return}A.paused?A.play():A.pause()};
A.onplay=A.onpause=()=>$('#pp').textContent=A.paused?'▶':'⏸';A.onerror=()=>note('El navegador no pudo leer este audio.');
$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>{if(A.currentTime>3)A.currentTime=0;else step(-1)};
$('#rp').onclick=()=>{rep=(rep+1)%3;$('#rp').textContent='🔁 '+['No','Una','Lista'][rep]};
$('#sh').onclick=()=>{shuf=!shuf;$('#sh').classList.toggle('on',shuf)};
$('#vo').oninput=e=>{clearInterval(fd);A.volume=+e.target.value};
$('#sk').oninput=e=>{drag=true;if(A.duration)A.currentTime=e.target.value/1000*A.duration};$('#sk').onchange=()=>drag=false;
A.onended=()=>{if(loop&&cur.a!=null){A.currentTime=cur.a;A.play();return}if(rep===1){A.currentTime=0;A.play();return}const i=queue.indexOf(cur&&cur.id);if(rep===2||shuf||i<queue.length-1)step(1)};
function fade(to){to=Math.min(1,Math.max(0,to));clearInterval(fd);fd=setInterval(()=>{const d=to-A.volume;if(Math.abs(d)<.02){A.volume=to;clearInterval(fd)}else A.volume=Math.min(1,Math.max(0,A.volume+d*.15))},100)}
/* loop A-B (parte favorita guardada por canción) */
const lc=()=>{if(loop&&cur&&cur.a!=null&&cur.b>cur.a&&A.currentTime>=cur.b)A.currentTime=cur.a};A.ontimeupdate=lc;
$('#sa').onclick=()=>{if(cur){cur.a=A.currentTime;put(cur);head()}};
$('#sb').onclick=()=>{if(cur){cur.b=A.currentTime;put(cur);head()}};
$('#ia').onchange=()=>{if(cur){cur.a=pt($('#ia').value);put(cur)}};$('#ib').onchange=()=>{if(cur){cur.b=pt($('#ib').value);put(cur)}};
$('#lp').onclick=()=>{if(!cur||cur.a==null||cur.b==null||cur.b<=cur.a)return alert('Elige un inicio (A) menor que el fin (B).');loop=!loop;if(loop&&(A.currentTime<cur.a||A.currentTime>=cur.b))A.currentTime=cur.a;head()};
/* letras */
let ly=[],li=-1,matches=[],mi=-1,mid=null,tap=null;
const msg=t=>$('#lm').textContent=t;
const parse=t=>{const o=[];for(const l of t.split('\n')){const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)],x=l.replace(/\[[^\]]*\]/g,'').trim();m.forEach(a=>o.push({t:+a[1]*60+ +a[2],x}))}return o};
const toL=a=>a.map(l=>`[${String(Math.floor(l.t/60)).padStart(2,'0')}:${(l.t%60).toFixed(2).padStart(5,'0')}] ${l.x}`).join('\n');
function loadLy(){ly=cur&&cur.lrc?parse(cur.lrc).sort((a,b)=>a.t-b.t):[];li=-1;$('#ly').innerHTML=ly.map((l,i)=>`<p data-i="${i}">${esc(l.x)||'♪'}</p>`).join('')||'<p>Sin letra todavía. Toca «Editar» para pegarla.</p>'}
$('#ly').onclick=e=>{const l=ly[e.target.dataset.i];if(l)A.currentTime=l.t};
function hl(){if(!ly.length)return;let i=-1;for(let k=0;k<ly.length&&ly[k].t<=A.currentTime;k++)i=k;if(i===li)return;li=i;const ps=$('#ly').children;for(let k=0;k<ps.length;k++)ps[k].classList.toggle('on',k===i);if($('#l').classList.contains('on')&&ps[i])ps[i].scrollIntoView({block:'center',behavior:'smooth'})}
const jf=async u=>{const x=await fetch(u);if(!x.ok)throw new Error('el servicio respondió '+x.status);return x.json()};
async function fetchLy(){if(!cur)return;msg('Buscando letra…');try{
 if(cur.id!==mid||!matches.length){mid=cur.id;const q=cur.artist?{track_name:cur.title,artist_name:cur.artist}:{q:cur.title};let r=await jf('https://lrclib.net/api/search?'+new URLSearchParams(q));
  if(!r.length&&cur.artist)r=await jf('https://lrclib.net/api/search?q='+encodeURIComponent(cur.artist+' '+cur.title));
  matches=r.filter(x=>x.syncedLyrics);if(isFinite(A.duration))matches.sort((p,q)=>Math.abs(p.duration-A.duration)-Math.abs(q.duration-A.duration));mi=-1}
 if(!matches.length){msg('No encontré letra sincronizada. Toca «Editar» para pegarla y sincronizarla.');return}
 mi=(mi+1)%matches.length;const m=matches[mi];cur.lrc=m.syncedLyrics;put(cur);loadLy();msg(`Coincidencia ${mi+1} de ${matches.length}: ${m.artistName} - ${m.trackName} (${ft(m.duration)})`)}
 catch(e){msg('No pude traer la letra. Detalle: '+e.message)}}
$('#lf').onclick=fetchLy;
$('#le').onclick=()=>{$('#edp').hidden=!$('#edp').hidden;$('#ed').value=cur?cur.lrc:''};
const shift=d=>{if(!cur||!cur.lrc)return;cur.lrc=toL(parse(cur.lrc).map(l=>({t:Math.max(0,l.t+d),x:l.x})));put(cur);loadLy();$('#ed').value=cur.lrc};
$('#o1').onclick=()=>shift(-.5);$('#o2').onclick=()=>shift(.5);
$('#sv').onclick=()=>{if(!cur)return;const t=$('#ed').value;
 if(/\[\d+:\d+/.test(t)){cur.lrc=toL(parse(t));put(cur);loadLy();msg('Letra guardada.');return}
 const L=t.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return;tap={L,o:[],i:0};$('#edp').hidden=true;$('#tapp').hidden=false;tpu()};
const tpu=()=>$('#tp').textContent=`Línea ${tap.i+1} de ${tap.L.length}: «${tap.L[tap.i]}»`;
$('#tb').onclick=()=>{if(!tap)return;if(A.paused)A.play();tap.o.push({t:Math.max(0,A.currentTime-.3),x:tap.L[tap.i]});tap.i++;
 if(tap.i>=tap.L.length){cur.lrc=toL(tap.o);put(cur);tap=null;$('#tapp').hidden=true;loadLy();msg('Letra sincronizada y guardada.')}else tpu()};
$('#tu').onclick=()=>{if(tap&&tap.i>0){tap.i--;tap.o.pop();tpu()}};$('#tc').onclick=()=>{tap=null;$('#tapp').hidden=true};
$('#ck').onclick=()=>{const L=parse($('#ed').value),w=[],D=A.duration;if(!L.length)w.push('No hay líneas con tiempo [mm:ss.xx].');
 L.forEach((l,i)=>{if(i&&l.t<L[i-1].t)w.push(`La línea ${i+1} está antes que la anterior (${ft(l.t)}).`);if(D&&l.t>D)w.push(`La línea ${i+1} pasa del final de la canción.`)});
 const S=[...L].sort((a,b)=>a.t-b.t);S.forEach((l,i)=>{if(i&&l.t-S[i-1].t>30)w.push(`Hueco de ${Math.round(l.t-S[i-1].t)} s antes de ${ft(l.t)}.`)});
 if(D&&S.length&&S[S.length-1].t<D*.6)w.push('La letra termina muy pronto: quizá es otra versión de la canción.');
 $('#chk').innerHTML=w.length?w.map(x=>`<p class="w">⚠ ${esc(x)}</p>`).join(''):'<p>✓ Todo en orden.</p>'};
/* Pomodoro */
const dur=p=>cfg[p]*60;
function cfgUI(){$('#cf').value=cfg.f;$('#cs').value=cfg.s;$('#cl').value=cfg.l;$('#cd').value=cfg.d;$('#cdv').textContent=cfg.d+'%'}
function pomUI(){const l=pom.run?(pom.end-Date.now())/1000:pom.left;$('#pt').textContent=ft(Math.ceil(Math.max(0,l)));$('#pph').textContent={f:'Enfoque',s:'Descanso',l:'Descanso largo'}[pom.ph];$('#pn').textContent='Pomodoros hoy: '+(st.pomos[day()]||0);$('#ps').textContent=pom.run?'Pausar':'Iniciar'}
['cf','cs','cl'].forEach((id,i)=>$('#'+id).onchange=e=>{const k='fsl'[i];cfg[k]=Math.max(1,+e.target.value||1);e.target.value=cfg[k];kvset('cfg',cfg);if(!pom.run&&pom.ph===k)pom.left=dur(k);pomUI()});
$('#cd').oninput=e=>{cfg.d=+e.target.value;$('#cdv').textContent=cfg.d+'%';kvset('cfg',cfg)};
function beep(){try{ac=ac||new(window.AudioContext||webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);g.gain.value=.3;o.frequency.value=880;o.start();o.stop(ac.currentTime+.6)}catch(e){}if(navigator.vibrate)navigator.vibrate(300)}
function nxt(skip){if(!skip&&pom.ph==='f')pjEvento('triste');if(pom.ph==='f'){if(!skip){pom.n++;st.pomos[day()]=(st.pomos[day()]||0)+1;dirty=true}pom.ph=pom.n%4?'s':'l';pom.vol=A.volume;fade(A.volume*cfg.d/100)}else{pom.ph='f';fade(pom.vol)}if(!skip)beep()}
function pomTick(){while(pom.run&&Date.now()>=pom.end){nxt();pom.end+=dur(pom.ph)*1000}pomUI()}
$('#ps').onclick=()=>{try{ac=ac||new(window.AudioContext||webkitAudioContext)();ac.resume()}catch(e){}if(pom.run){pom.left=(pom.end-Date.now())/1000;pom.run=false}else{pom.end=Date.now()+pom.left*1000;pom.run=true}pomUI()};
$('#pk').onclick=()=>{nxt(true);pom.left=dur(pom.ph);if(pom.run)pom.end=Date.now()+pom.left*1000;pomUI()};
$('#pr').onclick=()=>{if(pom.ph!=='f')fade(pom.vol);pom.run=false;pom.ph='f';pom.n=0;pom.left=dur('f');pomUI()};
/* estadísticas */
function stats(){const k=day(),top=[...songs].filter(s=>s.secs>0).sort((a,b)=>b.secs-a.secs).slice(0,10),c=(v,l)=>`<div class="it"><div class="t"><b>${v}</b><small>${l}</small></div></div>`;
 $('#sx').innerHTML=c(fh(st.tot),'Total escuchado')+c(fh(st.days[k]||0),'Hoy')+c(fh(st.focus),'Escuchado durante el enfoque')+c(st.pomos[k]||0,'Pomodoros de hoy')+'<h3>Más escuchadas</h3>'+(top.map((s,i)=>`<div class="it"><div class="t"><b>${i+1}. ${esc(s.title)}</b><small>${esc(s.artist||'Sin artista')}</small></div><span>${fh(s.secs)} · ${s.plays} ${s.plays===1?'vez':'veces'}</span></div>`).join('')||'<p class="mu">Todavía no hay datos.</p>')}
setInterval(()=>{if($('#s').classList.contains('on'))stats()},3000);
/* reloj principal */
let last=performance.now();
setInterval(()=>{const n=performance.now(),d=(n-last)/1000;last=n;
 if(cur&&!A.paused&&d<90){cur.secs+=d;st.tot+=d;const k=day();st.days[k]=(st.days[k]||0)+d;if(pom.run&&pom.ph==='f')st.focus+=d;dirty=true}
 lc();if(!drag&&A.duration)$('#sk').value=A.currentTime/A.duration*1000;
 $('#tm').textContent=ft(A.currentTime)+' / '+ft(A.duration||0);hl();pomTick()},100);
function save(){if(!dirty)return;dirty=false;if(cur)put(cur);kvset('st',st)}
setInterval(save,10000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
/* ===== PERSONAJE: edita aquí las frases y los tiempos ===== */
const PJ_CFG={vel:45,sentarTras:25,dormirTras:45,pausaMin:2.5,pausaMax:4.5,caminaMin:3,caminaMax:6,globoMs:2800,saludoMs:2500};
const PJ_FRASES={
 saluda:['¡Hola! ¿Qué escuchamos hoy?','¡Qué bueno verte por aquí!','¡Hola! Vamos con música.'],
 salta:['¡Nueva canción!','¡Esta me encanta!','¡Vamos con esta!'],
 sorpresa:['¡Ay! ¿Qué pasa?','¡Me asustaste!','¡Oye, cuidado!'],
 triste:['Se acabó el enfoque… buen trabajo.','Toca descansar un ratito.','Un pomodoro menos. ¡Bien hecho!'],
 sienta:['Uf, descansemos un poquito…','Me siento a esperar.','¿Sigues ahí?'],
 duerme:['zzz… shhh, estoy dormida.','zzz… no me despiertes.','zzz…'],
 camina:['¡Vamos a dar una vuelta!','Un paseíto corto…','Qué bonita música.'],
 pensa:['Hmm… ¿qué sigue?','Déjame pensar…','¿Qué escuchamos después?'],
 base:['Aquí estoy.','Lista para lo que sea.']
};
/* imágenes: deben estar en la misma carpeta que index.html */
const PJ_POSE={camina:'camina1.png',pensa:'pensando.png',base:'base.png',saluda:'saluda.png',salta:'salta.png',sorpresa:'sorprendida.png',triste:'triste.png',sienta:'sentada.png',duerme:'duerme.png'};
const PJ_TAM={sienta:'sit',duerme:'lie'};
const PJ={el:$('#pj'),fl:$('#pjf'),im:$('#pjim'),bub:$('#pjb'),bt:null,x:4,dir:1,mode:'',until:0,touch:Date.now(),t:0,hidden:false};
const pjGet=()=>{try{return localStorage.getItem('pjoculto')==='1'}catch(e){return false}};
const pjPut=v=>{try{localStorage.setItem('pjoculto',v?'1':'0')}catch(e){}};
function pjSize(){const r=document.documentElement.style;r.setProperty('--ph',Math.round(Math.min(200,Math.max(120,innerHeight*.2)))+'px');r.setProperty('--fh',$('footer').offsetHeight+'px')}
function pjAnim(c){PJ.im.className='';void PJ.im.offsetWidth;PJ.im.className=c||''}
function pjPlace(){const bw=PJ.bub.offsetWidth,w=PJ.fl.offsetWidth,cx=PJ.x+w/2;const bl=Math.max(6,Math.min(innerWidth-bw-6,cx-bw/2));PJ.bub.style.left=(bl-PJ.x)+'px'}
function pjSay(k){const L=PJ_FRASES[k];if(!L||PJ.hidden)return;PJ.bub.textContent=L[Math.random()*L.length|0];PJ.bub.hidden=false;clearTimeout(PJ.bt);PJ.bt=setTimeout(()=>PJ.bub.hidden=true,PJ_CFG.globoMs);pjPlace()}
function pjSet(mode,k,anim,ms){PJ.mode=mode;PJ.im.src=PJ_POSE[k];pjAnim([PJ_TAM[k],anim].filter(Boolean).join(' '));PJ.until=ms===Infinity?Infinity:Date.now()+ms;pjSay(k)}
function pjPausa(){const c=Math.random()<.15;pjSet('pausa',c?'base':'pensa','',(PJ_CFG.pausaMin+Math.random()*(PJ_CFG.pausaMax-PJ_CFG.pausaMin))*1000)}
function pjCamina(){if(Math.random()<.3)PJ.dir*=-1;pjSet('walk','camina','',(PJ_CFG.caminaMin+Math.random()*(PJ_CFG.caminaMax-PJ_CFG.caminaMin))*1000)}
function pjEvento(k){if(PJ.hidden)return;const ms={triste:4000,salta:1800,sorpresa:1600,saluda:PJ_CFG.saludoMs}[k]||2000;const anim={triste:'sink',salta:'jump',sorpresa:'shake',saluda:'wave'}[k]||'';pjSet(k,k,anim,ms)}
function pjTick(){if(PJ.hidden)return;const idle=(Date.now()-PJ.touch)/1000,now=Date.now();
 if(PJ.mode==='sienta'){if(idle>PJ_CFG.dormirTras)pjSet('duerme','duerme','breathe',Infinity);return}
 if(PJ.mode==='duerme')return;
 if(idle>PJ_CFG.sentarTras){pjSet('sienta','sienta','breathe',Infinity);return}
 if(now>=PJ.until){if(PJ.mode==='pausa')pjCamina();else pjPausa()}}
function pjLoop(now){const dt=PJ.t?Math.min(.05,(now-PJ.t)/1000):0;PJ.t=now;
 if(!PJ.hidden){
  if(PJ.mode==='walk'){
   PJ.x+=PJ.dir*PJ_CFG.vel*dt;
   const max=innerWidth-PJ.fl.offsetWidth-4;
   if(PJ.x>max){PJ.x=max;PJ.dir=-1}
   if(PJ.x<4){PJ.x=4;PJ.dir=1}
   const s=Math.sin(now/160);
   PJ.im.style.transform=`translateY(${-Math.abs(s)*6}px) rotate(${s*1.5}deg)`;
  }else if(PJ.im.style.transform)PJ.im.style.transform='';
  PJ.fl.style.transform=`scaleX(${PJ.dir>0?1:-1})`;
  PJ.el.style.transform=`translate3d(${PJ.x}px,0,0)`;
  if(!PJ.bub.hidden)pjPlace();
 }
 requestAnimationFrame(pjLoop)}
/* cualquier toque o tecla cuenta como actividad; si estaba sentada o dormida, se despierta */
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{const estaba=PJ.mode;PJ.touch=Date.now();if(estaba==='sienta'||estaba==='duerme')pjEvento('sorpresa')},{passive:true}));
A.addEventListener('loadedmetadata',()=>{if(!PJ.hidden)pjEvento('salta')});
PJ.im.onpointerdown=e=>{e.stopPropagation();pjEvento('sorpresa')};
$('#pjt').onclick=()=>{PJ.hidden=!PJ.hidden;pjPut(PJ.hidden);PJ.el.classList.toggle('off',PJ.hidden);$('#pjt').textContent=PJ.hidden?'🐾 mostrar':'🐾 ocultar';if(PJ.hidden)PJ.bub.hidden=true;else{PJ.touch=Date.now();pjEvento('saluda')}};
PJ.hidden=pjGet();PJ.el.classList.toggle('off',PJ.hidden);$('#pjt').textContent=PJ.hidden?'🐾 mostrar':'🐾 ocultar';
pjSize();new ResizeObserver(pjSize).observe($('footer'));addEventListener('resize',pjSize);
setInterval(pjTick,300);requestAnimationFrame(pjLoop);
if(!PJ.hidden)pjEvento('saluda');
</script></body></html>
